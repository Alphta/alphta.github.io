{{/* 阅读计数器脚本：文章页加载时向 api.alphta.com 上报并显示阅读数 */}}
<script>
document.addEventListener("DOMContentLoaded", function () {
    var el = document.getElementById("view-count");
    if (!el) return;
    el.textContent = "阅读 …";
    fetch("https://api.alphta.com/hit?path=" + encodeURIComponent(location.pathname))
        .then(function (r) { return r.json(); })
        .then(function (d) {
            if (typeof d.views === "number") {
                el.textContent = "阅读 " + d.views;
            } else {
                el.style.display = "none";
            }
        })
        .catch(function () { el.style.display = "none"; });
});
</script>

<style>
/* 正文图片与文字同宽：抵消 Stack 图片容器的出血负边距 */
.article-content .gallery,
.article-content figure,
.article-content a.gallery,
.article-content .pswp-gallery,
.article-content .video-wrapper,
.article-content .table-wrapper {
    margin-left: 0 !important;
    margin-right: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
}

.article-content img {
    max-width: 100% !important;
    height: auto;
}

/* 全部正文图片统一占满文字列宽，高度按原比例 */
.article-content .gallery img,
.article-content a.gallery img,
.article-content figure.gallery-image img {
    width: 100% !important;
    height: auto;
    display: block;
    object-fit: cover;
}

/* 小于正文宽度的图片居中显示 */
.article-content figure,
.article-content figure.gallery-image {
    text-align: center;
}

/* 统一正文栏宽：有目录/无目录的文章阅读列现在不一致（604 vs 954），锁到同一宽度 */
@media (min-width: 1024px) {
    .main-article {
        max-width: 664px;
        margin-left: auto;
        margin-right: auto;
    }
}
</style>
