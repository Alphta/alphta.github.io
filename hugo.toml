baseURL                = "https://essay.alphta.com/"
title                  = "Alphta 的博客"
theme                  = "hugo-theme-stack"
languageCode           = "zh-cn"
locale                 = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage         = true
enableEmoji            = true

[pagination]
    pagerSize = 8

[permalinks]
    page = "/:slug/"

[outputs]
    home    = ["HTML", "RSS", "JSON"]
    section = ["HTML", "RSS"]

[params]
    mainSections   = ["posts"]
    rssFullContent = true

    [params.footer]
        since = 2026

    [params.sidebar]
        emoji    = "✍️"
        subtitle = "记录想法与笔记"

    [params.article]
        [params.article.license]
            enabled = false

    [params.widgets]
        # 首页：左侧已有搜索图标，右侧不再放搜索框
        homepage = [
            { type = "archives", params = { limit = 5 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        # 文章页：搜索 + 目录 + 归档 + 标签云
        page = [
            { type = "search" },
            { type = "toc" },
            { type = "archives", params = { limit = 5 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]

    [params.comments]
        enabled = false

    [params.colorScheme]
        toggle  = true
        default = "auto"

[[menu.main]]
    identifier = "desk"
    name       = "净值"
    url        = "https://essay.alphta.com/desk/"
    weight     = -80

    [menu.main.params]
        icon = "chart-line"

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.tableOfContents]
        startLevel = 2
        endLevel   = 4
        ordered    = true
    [markup.highlight]
        noClasses = false
