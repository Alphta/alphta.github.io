<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组合净值</title>
<script>
// 与博客共用配色偏好（Stack 主题存在 localStorage 的 StackColorScheme）
(function () {
    var pref = localStorage.getItem("StackColorScheme") || "auto";
    var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", dark);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
    :root {
        --bg: #f5f5fa;
        --card: #ffffff;
        --border: #e6e7ec;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #2f6fdb;
        --up: #c0392b;
        --down: #1f8a4c;
        --grid: #eceef2;
        --area-top: rgba(47, 111, 219, 0.18);
        --area-bottom: rgba(47, 111, 219, 0.01);
        --marker-fill: #ffffff;
        --tooltip-bg: #ffffff;
        --tooltip-border: #e2e4ea;
    }
    html.dark {
        --bg: #0f1216;
        --card: #171b21;
        --border: #262c35;
        --text: #e6e9ee;
        --muted: #8b95a3;
        --accent: #4ea1ff;
        --up: #e05c5c;
        --down: #3ba55d;
        --grid: #1f252d;
        --area-top: rgba(78, 161, 255, 0.22);
        --area-bottom: rgba(78, 161, 255, 0.01);
        --marker-fill: #0f1216;
        --tooltip-bg: #1d232b;
        --tooltip-border: #2c3440;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 24px 20px 40px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    }
    .wrap { max-width: 1080px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .back { color: var(--muted); text-decoration: none; font-size: 13px; }
    .back:hover { color: var(--accent); }
    .theme-btn {
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 8px;
        width: 34px; height: 34px;
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: color 0.2s ease, border-color 0.2s ease;
    }
    .theme-btn:hover { color: var(--accent); border-color: var(--accent); }
    .theme-btn svg { display: block; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }
    .kpi {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
    }
    .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .kpi .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .chart-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 10px 6px;
    }
    #chart { width: 100%; height: 460px; }
    .updated { color: var(--muted); font-size: 12px; margin-top: 12px; }
    @media (max-width: 640px) {
        #chart { height: 320px; }
        .kpi .value { font-size: 18px; }
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <a class="back" href="https://essay.alphta.com/">← 返回博客</a>
        <button class="theme-btn" id="theme-btn" aria-label="切换明暗"></button>
    </div>

    <h1>组合净值</h1>
    <div class="sub" id="sub">加载中…</div>

    <div class="kpis" id="kpis"></div>

    <div class="chart-card">
        <div id="chart"></div>
    </div>

    <div class="updated">数据更新于 <span id="updated">-</span></div>
</div>

<script>
const DATA = {"series": [["2026-10-20", 100.0, 1], ["2026-10-21", 100.0, 1]], "actual": [["2026-10-20", 100.0], ["2026-10-21", 100.0]], "stats": {"first": 100.0, "last": 100.0, "total": 0.0, "cagr": 0.0, "mdd": 0, "days": 1, "updated": "2026-10-21"}};

const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

const pct = v => (v * 100).toFixed(2) + "%";
const cls = v => v >= 0 ? "up" : "down";
let chart = null;

function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderChart() {
    const el = document.getElementById("chart");
    if (!chart) chart = echarts.init(el, null, { renderer: "canvas" });

    chart.setOption({
        backgroundColor: "transparent",
        grid: { left: 10, right: 18, top: 24, bottom: 10, containLabel: true },
        tooltip: {
            trigger: "axis",
            backgroundColor: cssVar("--tooltip-bg"),
            borderColor: cssVar("--tooltip-border"),
            textStyle: { color: cssVar("--text"), fontSize: 12 },
            formatter: params => {
                const p = params[0];
                return `${p.value[0]}<br/><b>指数 ${Number(p.value[1]).toFixed(2)}</b>`;
            }
        },
        xAxis: {
            type: "time",
            axisLine: { lineStyle: { color: cssVar("--grid") } },
            axisLabel: { color: cssVar("--muted"), fontSize: 11 },
            splitLine: { show: false }
        },
        yAxis: {
            type: "value",
            scale: true,
            axisLine: { show: false },
            axisTick: { show: false },
            axisLabel: {
                color: cssVar("--muted"), fontSize: 11,
                formatter: v => Number(v).toFixed(0)
            },
            splitLine: { lineStyle: { color: cssVar("--grid") } }
        },
        series: [
            {
                name: "净值",
                type: "line",
                data: (DATA.series || []).map(p => [p[0], p[1]]),
                showSymbol: false,
                lineStyle: { width: 2, color: cssVar("--accent") },
                areaStyle: {
                    color: {
                        type: "linear", x: 0, y: 0, x2: 0, y2: 1,
                        colorStops: [
                            { offset: 0, color: cssVar("--area-top") },
                            { offset: 1, color: cssVar("--area-bottom") }
                        ]
                    }
                }
            },
            {
                name: "实盘",
                type: "scatter",
                data: DATA.actual || [],
                symbolSize: 8,
                itemStyle: {
                    color: cssVar("--marker-fill"),
                    borderColor: cssVar("--accent"),
                    borderWidth: 2
                }
            }
        ]
    }, true);
}

function renderKpis() {
    const s = DATA.stats || {};
    const series = DATA.series || [];
    document.getElementById("sub").textContent = `${(s.days || 0)} 天 · ${series.length} 个数据点`;
    document.getElementById("updated").textContent = s.updated || "-";

    const kpis = [
        { label: "最新指数", value: (s.last || 0).toFixed(2) },
        { label: "累计收益", value: pct(s.total || 0), klass: cls(s.total || 0) },
        { label: "年化收益", value: pct(s.cagr || 0), klass: cls(s.cagr || 0) },
        { label: "最大回撤", value: pct(s.mdd || 0), klass: "down" }
    ];
    document.getElementById("kpis").innerHTML = kpis.map(k => `
        <div class="kpi">
            <div class="label">${k.label}</div>
            <div class="value ${k.klass || ""}">${k.value}</div>
        </div>`).join("");
}

function syncThemeButton() {
    const isDark = document.documentElement.classList.contains("dark");
    document.getElementById("theme-btn").innerHTML = isDark ? SUN : MOON;
}

function setTheme(dark, persist) {
    document.documentElement.classList.toggle("dark", dark);
    if (persist) localStorage.setItem("StackColorScheme", dark ? "dark" : "light");
    syncThemeButton();
    renderChart();
}

document.getElementById("theme-btn").addEventListener("click", () => {
    setTheme(!document.documentElement.classList.contains("dark"), true);
});

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    if ((localStorage.getItem("StackColorScheme") || "auto") === "auto") setTheme(e.matches, false);
});

window.addEventListener("resize", () => chart && chart.resize());

renderKpis();
renderChart();
syncThemeButton();
</script>
</body>
</html>
