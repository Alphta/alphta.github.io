baseURL                = "https://essay.alphta.com/"
title                  = "Alphta 的博客"
theme                  = "hugo-theme-stack"
languageCode           = "zh-cn"
locale                 = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage         = true
enableEmoji            = true

[pagination]
    pagerSize = 8

[permalinks]
    page = "/:slug/"

[outputs]
    home    = ["HTML", "RSS", "JSON"]
    section = ["HTML", "RSS"]

[params]
    mainSections   = ["posts"]
    rssFullContent = true

    [params.footer]
        since = 2026

    [params.sidebar]
        emoji    = "✍️"
        subtitle = "记录想法与笔记"

    [params.article]
        [params.article.license]
            enabled = false

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [{ type = "toc" }]

    [params.comments]
        enabled = false

    [params.colorScheme]
        toggle  = true
        default = "auto"

[[menu.main]]
    identifier = "desk"
    name       = "净值"
    url        = "https://essay.alphta.com/desk/"
    weight     = -75

    [menu.main.params]
        icon = "chart-line"

[[menu.social]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/Alphta"

    [menu.social.params]
        icon = "brand-github"

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.tableOfContents]
        startLevel = 2
        endLevel   = 4
        ordered    = true
    [markup.highlight]
        noClasses = false
