baseURL                = "https://essay.alphta.com/"
title                  = "荒唐镜的人生"
theme                  = "hugo-theme-stack"
languageCode           = "zh-cn"
locale                 = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage         = true
enableEmoji            = true

[pagination]
    pagerSize = 8

[permalinks]
    page = "/:slug/"

[outputs]
    home    = ["HTML", "RSS", "JSON", "llms"]
    section = ["HTML", "RSS"]

# llms.txt：给 AI 抓取器/检索器的站点索引（https://llmstxt.org）
[outputFormats.llms]
    mediaType   = "text/plain"
    baseName    = "llms"
    isPlainText = true
    isHTML      = false

[params]
    mainSections   = ["posts"]
    rssFullContent = true

    [params.footer]
        since = 2026

    [params.sidebar]
        emoji    = "✍️"
        subtitle = "记录想法与笔记"

    [params.article]
        [params.article.license]
            enabled = false

    [params.widgets]
        # 首页：左侧已有搜索图标，右侧不再放搜索框
        homepage = [
            { type = "archives", params = { limit = 5 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        # 文章页：搜索 + 目录 + 归档 + 标签云
        page = [
            { type = "search" },
            { type = "toc" },
            { type = "archives", params = { limit = 5 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]

    [params.comments]
        enabled = true
        provider = "giscus"

        [params.comments.giscus]
            repo = "Alphta/alphta.github.io"
            repoID = "MDEwOlJlcG9zaXRvcnkxMjUzNTgxMDM="
            category = "Announcements"
            categoryID = "DIC_kwDOB3jQF84DJFrp"
            mapping = "pathname"
            strict = 0
            reactionsEnabled = 1
            emitMetadata = 0
            inputPosition = "top"
            lightTheme = "light"
            darkTheme = "dark"
            lang = "zh-CN"
            loading = "lazy"

    # 文章底部赞赏（留空则不显示对应渠道）
    [params.tip]
        enabled = false   # 暂时不显示赞赏；以后填好渠道改成 true 即可
        title = "觉得这篇文章有用？"
        note = "你的支持是我继续写下去的动力"
        afdian = ""
        wechat_qr = ""
        alipay_qr = ""

    [params.colorScheme]
        toggle  = true
        default = "auto"

[[menu.main]]
    identifier = "desk"
    name       = "净值"
    url        = "https://essay.alphta.com/desk/"
    weight     = -80

    [menu.main.params]
        icon = "chart-line"

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.extensions.passthrough]
            enable = true
            [markup.goldmark.extensions.passthrough.delimiters]
                block = [['$$', '$$'], ['\[', '\]']]
                inline = [['$', '$'], ['\(', '\)']]
    [markup.tableOfContents]
        startLevel = 2
        endLevel   = 4
        ordered    = true
    [markup.highlight]
        noClasses = false
