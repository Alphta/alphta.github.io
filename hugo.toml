baseURL = "https://essay.alphta.com/"
title = "Alphta 的博客"
theme = "PaperMod"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
paginate = 10
enableEmoji = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Alphta 的个人博客"
  author = "Alphta"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "你好，我是 Alphta"
    Content = "欢迎来到我的博客，这里记录我的想法和笔记。"

  [params.socialIcons]
    # 按需添加，例如：
    # - name = "github"
    #   url = "https://github.com/Alphta"

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 1

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 2

[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 3

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 4
